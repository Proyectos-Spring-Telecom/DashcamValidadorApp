org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Desactivar compilación incremental de Kotlin para evitar errores con rutas en diferentes unidades
# Esto es necesario cuando el proyecto está en una unidad diferente (D:) a la del caché de pub (C:)
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false

# Configuraciones adicionales para mejorar la estabilidad de Gradle
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.parallel=false
org.gradle.daemon=true